# ─────────────────────────────────────────────
#  Основные настройки сайта. Меняйте смело.
# ─────────────────────────────────────────────
baseURL = "https://example.org/"      # в GitHub Actions подставится автоматически
languageCode = "ru-RU"
defaultContentLanguage = "ru"
title = "Красный Кабан"
enableRobotsTXT = true
capitalizeListTitles = false
summaryLength = 40

[params]
  author = "Красный Кабан"
  description = "Материалы, политэкономический анализ и критические статьи проекта «Красный Кабан»."
  # Картинка для превью ссылок (Telegram, WhatsApp). Положите файл в static/
  ogImage = "og-default.png"
  # Хеш Instant View для Telegram (если настроен на instantview.telegram.org)
  telegram_iv_rhash = ""

[taxonomies]
  tag = "tags"

[permalinks]
  articles = "/:slugorfilename/"

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions]
    [markup.goldmark.extensions.typographer]
      leftDoubleQuote = "«"
      rightDoubleQuote = "»"
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)'], ['$', '$']]

[outputs]
  home = ["HTML", "RSS"]
