# ─────────────────────────────────────────────
#  Основные настройки сайта. Меняйте смело.
# ─────────────────────────────────────────────
baseURL = "https://example.org/"      # в GitHub Actions подставится автоматически
languageCode = "ru-RU"
defaultContentLanguage = "ru"
title = "Красный Кабан"
enableRobotsTXT = true
capitalizeListTitles = false
summaryLength = 40

[params]
  author = "Красный Кабан"
  description = "Материалы, политэкономический анализ и критические статьи проекта «Красный Кабан»."
  # Картинка для превью ссылок (Telegram, WhatsApp). Положите файл в static/
  ogImage = "og-default.png"
  # Хеш Instant View для Telegram (если настроен на instantview.telegram.org)
  telegram_iv_rhash = ""
  # Ссылка на ваш Telegram-канал, например "https://t.me/krasny_kaban". Пусто — кнопка скрыта
  telegram_channel = ""

  # Комментарии Giscus (GitHub Discussions). Пусто — блок комментариев скрыт.
  # Значения берутся на https://giscus.app после установки приложения Giscus в репозиторий
  [params.giscus]
    repo = ""
    repoId = ""
    category = ""
    categoryId = ""

[related]
  includeNewer = true
  threshold = 20
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100

[taxonomies]
  tag = "tags"

[permalinks]
  articles = "/:slugorfilename/"

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions]
    [markup.goldmark.extensions.typographer]
      leftDoubleQuote = "«"
      rightDoubleQuote = "»"
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)'], ['$', '$']]

[outputs]
  home = ["HTML", "RSS"]
