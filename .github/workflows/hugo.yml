# Автоматическая сборка и публикация сайта на GitHub Pages.
name: Публикация сайта

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.167.0
    steps:
      - name: Установка Hugo
        run: |
          wget -O \${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v\${HUGO_VERSION}/hugo_extended_\${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i \${{ runner.temp }}/hugo.deb

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Установка генераторов
        run: npm ci

      - name: Проверка шрифтов
        run: |
          fc-list | grep -qi "DejaVu Serif" || (sudo apt-get update && sudo apt-get install -y fonts-dejavu-core)

      - id: pages
        uses: actions/configure-pages@v5

      - name: Сборка
        env:
          TZ: Europe/Berlin
        run: hugo --gc --minify --printPathWarnings --baseURL "\${{ steps.pages.outputs.base_url }}/"

      - name: Картинки формул для Telegram Instant View
        run: npm run math -- public

      - name: Превью-картинки статей
        run: node scripts/og-images.mjs public

      - name: Поисковый индекс
        run: npx -y pagefind@1.3.0 --site public

      - name: Проверка результата сборки
        run: |
          test -f public/index.html
          test -f public/sitemap.xml
          test -f public/index.xml
          test -d public/pagefind
          test -f public/favicon.svg

      - name: Загрузка артефакта GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
