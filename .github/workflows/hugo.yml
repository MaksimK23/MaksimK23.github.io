# Автоматическая публикация сайта на GitHub Pages при каждом изменении.
name: Публикация сайта

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.140.2
    steps:
      - name: Установка Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Установка генератора картинок формул
        run: |
          npm install --no-audit --no-fund
          fc-list | grep -qi "DejaVu Serif" || (sudo apt-get update && sudo apt-get install -y fonts-dejavu-core)
      - id: pages
        uses: actions/configure-pages@v5
      - name: Сборка
        env:
          TZ: Europe/Berlin
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Картинки формул для Telegram Instant View
        run: node scripts/math-png.mjs public
      - name: Превью-картинки статей
        run: node scripts/og-images.mjs public
      - name: Поисковый индекс
        run: npx -y pagefind@1.3.0 --site public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
