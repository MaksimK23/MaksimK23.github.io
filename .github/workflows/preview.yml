# PR previews for GitHub Pages.
name: Preview PR

on:
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: "gh-pages-deploy"
  cancel-in-progress: false

jobs:
  build-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.167.0
      PREVIEW_BASE_URL: https://maksimk23.github.io/pr-preview/pr-${{ github.event.pull_request.number }}/
    steps:
      - name: Установка Hugo
        run: |
          wget -q -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          echo "2d012c4490248195e2db07e89ce7f76af8bead93233e930bdf3733c53acd3b23  ${{ runner.temp }}/hugo.deb" | sha256sum -c -
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Установка генераторов
        run: npm ci

      - name: Проверка front matter и контента
        run: npm run validate-content

      - name: Проверка шрифтов
        run: |
          fc-list | grep -qi "DejaVu Serif" || (sudo apt-get update && sudo apt-get install -y fonts-dejavu-core)

      - name: Сборка preview
        env:
          TZ: Europe/Berlin
        run: hugo --gc --minify --printPathWarnings --baseURL "${PREVIEW_BASE_URL}"

      - name: Картинки формул для Telegram Instant View
        run: npm run math -- public

      - name: Превью-картинки статей
        run: node scripts/og-images.mjs public

      - name: Поисковый индекс
        run: npm run pagefind


      - name: Проверка ссылок, якорей и изображений
        run: npm run check-site
      - name: Проверка результата сборки
        run: |
          test -f public/index.html
          test -f public/sitemap.xml
          test -f public/index.xml
          test -d public/pagefind
          test -f public/favicon.svg

      - name: Сохранение preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: public
          if-no-files-found: error

  publish-preview:
    if: github.event.action != 'closed'
    needs: build-preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Загрузка preview artifact
        uses: actions/download-artifact@v5
        with:
          name: preview-site
          path: public

      - name: Публикация preview
        uses: rossjrw/pr-preview-action@v1.8.1 # v1.8.1
        with:
          source-dir: public
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
          wait-for-pages-deployment: true
          comment: true
          qr-code: false

  remove-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Удаление preview
        uses: rossjrw/pr-preview-action@v1.8.1 # v1.8.1
        with:
          source-dir: public
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
          comment: true
          qr-code: false
