{{ define "main" }}
<section class="wrap hero hero-sm">
  <p class="eyebrow">Навигация</p>
  <h1>Поиск по статьям</h1>
</section>
<section class="wrap search-wrap">
  <div id="search"></div>
  <noscript>Для поиска нужен JavaScript.</noscript>
</section>
<link rel="stylesheet" href="{{ "pagefind/pagefind-ui.css" | relURL }}">
<script src="{{ "pagefind/pagefind-ui.js" | relURL }}"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    var s = document.querySelector('script[src*="pagefind-ui.js"]').src;
    var base = new URL(s.replace(/pagefind\/pagefind-ui\.js.*$/, '')).pathname;
    var ui = new PagefindUI({
      element: '#search',
      baseUrl: base,
      showSubResults: true,
      showImages: false,
      resetStyles: false,
      openFilters: ['Формат', 'Год'],
      translations: {
        placeholder: 'Например: вывоз капитала, диалектический детерминизм',
        clear_search: 'Очистить',
        load_more: 'Показать ещё результаты',
        search_label: 'Поиск по статьям',
        filters_label: 'Фильтры',
        zero_results: 'По запросу «[SEARCH_TERM]» ничего не найдено',
        many_results: 'Найдено [COUNT] совпадений по запросу «[SEARCH_TERM]»',
        one_result: 'Найдено 1 совпадение по запросу «[SEARCH_TERM]»',
        alt_search: 'По запросу «[SEARCH_TERM]» ничего не найдено. Показаны результаты для «[DIFFERENT_TERM]»',
        search_suggestion: 'По запросу «[SEARCH_TERM]» ничего не найдено. Попробуйте один из вариантов:',
        searching: 'Идёт поиск «[SEARCH_TERM]»…'
      }
    });
    var params = new URLSearchParams(location.search);
    var q = params.get('q');
    if (q) ui.triggerSearch(q);
    var root = document.getElementById('search');
    root.addEventListener('input', function (e) {
      if (!e.target.classList.contains('pagefind-ui__search-input')) return;
      var val = e.target.value.trim();
      var url = new URL(location.href);
      if (val) url.searchParams.set('q', val); else url.searchParams.delete('q');
      history.replaceState(null, '', url.pathname + url.search);
    });
    setTimeout(function () {
      var inp = root.querySelector('.pagefind-ui__search-input');
      if (inp && !q) inp.focus();
    }, 50);
  });
</script>
{{ end }}
