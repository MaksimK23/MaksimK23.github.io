<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="{{ site.Title }} — на главную">
      {{ partial "logo.html" . }}<span>{{ site.Title }}</span>
    </a>
    <nav class="nav" aria-label="Основная навигация">
      <a href="{{ "/" | relURL }}">Статьи</a>
      <a href="{{ with site.GetPage "/tags" }}{{ .RelPermalink }}{{ end }}">Темы</a>
      <a class="nav-search" href="{{ with site.GetPage "/search" }}{{ .RelPermalink }}{{ end }}" aria-label="Поиск">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </a>
      {{ if and .IsPage (eq .Section "articles") }}
      <div class="fs-ctrl" role="group" aria-label="Размер текста">
        <button class="icon-btn fs-btn" type="button" data-fs="-1" aria-label="Уменьшить текст">A<sup>−</sup></button>
        <button class="icon-btn fs-btn" type="button" data-fs="1" aria-label="Увеличить текст">A<sup>+</sup></button>
      </div>
      {{ end }}
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Переключить тему" aria-pressed="false">
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </nav>
  </div>
</header>
